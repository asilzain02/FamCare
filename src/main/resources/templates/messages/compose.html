<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compose Message - FamCare</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .compose-container {
            max-width: 900px;
            margin: 0 auto;
        }

        .compose-box {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .compose-header {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f5f5f5;
        }

        .compose-header h1 {
            color: #2196F3;
            margin: 0;
        }

        .form-row {
            display: grid;
            gap: 20px;
            margin-bottom: 25px;
        }

        .form-field {
            display: flex;
            flex-direction: column;
        }

        .form-field label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        .form-field input,
        .form-field select,
        .form-field textarea {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-field input:focus,
        .form-field select:focus,
        .form-field textarea:focus {
            outline: none;
            border-color: #2196F3;
        }

        .form-field textarea {
            min-height: 200px;
            resize: vertical;
            font-family: inherit;
        }

        .char-counter {
            text-align: right;
            font-size: 0.85rem;
            color: #999;
            margin-top: 5px;
        }

        .form-actions {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn-compose {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-send {
            background: linear-gradient(135deg, #2196F3 0%, #1976D2 100%);
            color: white;
        }

        .btn-send:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(33, 150, 243, 0.4);
        }

        .btn-cancel {
            background: #f5f5f5;
            color: #666;
        }

        .btn-cancel:hover {
            background: #e0e0e0;
        }

        .reply-info {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #2196F3;
        }

        .reply-info strong {
            color: #1565c0;
        }

        .quick-templates {
            margin-bottom: 20px;
        }

        .template-btn {
            display: inline-block;
            padding: 8px 16px;
            margin: 5px;
            background: #f5f5f5;
            border: 1px solid #e0e0e0;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .template-btn:hover {
            background: #2196F3;
            color: white;
            border-color: #2196F3;
        }

        @media (max-width: 768px) {
            .compose-box {
                padding: 20px;
            }

            .form-actions {
                flex-direction: column;
            }

            .btn-compose {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">🏥 FamCare</h1>
            <div class="nav-links">
                <span>Compose Message</span>
                <a href="/messages/inbox">Back to Inbox</a>
                <a href="/">Dashboard</a>
                <a href="/logout">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="compose-container">
            <div class="compose-box">
                <div class="compose-header">
                    <h1>✏️ Compose New Message</h1>
                </div>

                <!-- Reply Info -->
                <div th:if="${replyTo != null}" class="reply-info">
                    <strong>📩 Replying to previous message</strong>
                </div>

                <!-- Error Message -->
                <div th:if="${error}" class="alert alert-error">
                    <p th:text="${error}"></p>
                </div>

                <!-- Compose Form -->
                <form method="POST" th:action="@{/messages/send}" id="composeForm">
                    <input type="hidden" name="replyTo" th:value="${replyTo}">

                    <!-- Recipient -->
                    <div class="form-row">
                        <div class="form-field">
                            <label for="receiverId">To: *</label>
                            <select id="receiverId" name="receiverId" required th:attr="data-preselect=${recipientId}">
                                <option value="">Select recipient...</option>
                                <option th:each="member : ${familyMembers}" 
                                        th:value="${member.id}" 
                                        th:text="${member.fullName + ' (' + member.username + ')'}"
                                        th:selected="${recipientId != null and recipientId == member.id}">
                                </option>
                            </select>
                        </div>
                    </div>

                    <!-- Subject -->
                    <div class="form-row">
                        <div class="form-field">
                            <label for="subject">Subject: *</label>
                            <input type="text" 
                                   id="subject" 
                                   name="subject" 
                                   th:value="${subject}"
                                   placeholder="Enter message subject..."
                                   maxlength="200"
                                   required>
                            <div class="char-counter">
                                <span id="subjectCount">0</span>/200
                            </div>
                        </div>
                    </div>

                    <!-- Quick Templates -->
                    <div class="quick-templates">
                        <label style="font-weight: 600; margin-bottom: 10px; display: block;">Quick Templates:</label>
                        <span class="template-btn" onclick="insertTemplate('check-in')">👋 Check-in</span>
                        <span class="template-btn" onclick="insertTemplate('encouragement')">💪 Encouragement</span>
                        <span class="template-btn" onclick="insertTemplate('question')">❓ Question</span>
                        <span class="template-btn" onclick="insertTemplate('gratitude')">🙏 Gratitude</span>
                    </div>

                    <!-- Message Body -->
                    <div class="form-row">
                        <div class="form-field">
                            <label for="messageBody">Message: *</label>
                            <textarea id="messageBody" 
                                      name="messageBody" 
                                      placeholder="Write your message here..."
                                      maxlength="2000"
                                      required></textarea>
                            <div class="char-counter">
                                <span id="bodyCount">0</span>/2000
                            </div>
                        </div>
                    </div>

                    <!-- Actions -->
                    <div class="form-actions">
                        <button type="submit" class="btn-compose btn-send">📤 Send Message</button>
                        <button type="button" class="btn-compose btn-cancel" onclick="window.location.href='/messages/inbox'">
                            ❌ Cancel
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Character counters
        const subjectInput = document.getElementById('subject');
        const bodyInput = document.getElementById('messageBody');
        const subjectCount = document.getElementById('subjectCount');
        const bodyCount = document.getElementById('bodyCount');

        subjectInput.addEventListener('input', function() {
            subjectCount.textContent = this.value.length;
        });

        bodyInput.addEventListener('input', function() {
            bodyCount.textContent = this.value.length;
        });

        // Initialize counters
        subjectCount.textContent = subjectInput.value.length;
        bodyCount.textContent = bodyInput.value.length;

        // Message templates
        const templates = {
            'check-in': "Hi! Just checking in to see how you're doing today. Hope everything is going well! 😊",
            'encouragement': "I wanted to let you know that I'm proud of you! Keep up the great work. You're doing amazing! 💪✨",
            'question': "I hope you're doing well! I wanted to ask you something. Could you let me know when you have a moment?",
            'gratitude': "Thank you so much for everything you do! Your support means a lot to me. I really appreciate you! 🙏❤️"
        };

        function insertTemplate(templateName) {
            const template = templates[templateName];
            if (template) {
                bodyInput.value = template;
                bodyCount.textContent = template.length;
                bodyInput.focus();
            }
        }

        // Form validation
        document.getElementById('composeForm').addEventListener('submit', function(e) {
            const receiver = document.getElementById('receiverId').value;
            const subject = document.getElementById('subject').value.trim();
            const body = document.getElementById('messageBody').value.trim();

            if (!receiver || !subject || !body) {
                e.preventDefault();
                alert('Please fill in all required fields');
                return false;
            }

            if (subject.length < 3) {
                e.preventDefault();
                alert('Subject must be at least 3 characters long');
                return false;
            }

            if (body.length < 10) {
                e.preventDefault();
                alert('Message must be at least 10 characters long');
                return false;
            }

            return true;
        });
    </script>
</body>
</html>
